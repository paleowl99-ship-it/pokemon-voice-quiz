<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="寶可夢猜謎" />
<meta name="theme-color" content="#0b1120" />
<title>寶可夢語音猜謎</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--bg:#0b1120;--card:#111827;--card2:#0f172a;--fg:#f8fafc;--muted:#94a3b8;--border:#263148;--accent:#f59e0b;--accent-fg:#1c1303;--ok:#34d399;--okbg:rgba(16,185,129,.18);--bad:#fb7185;--badbg:rgba(244,63,94,.18)}
  @media (prefers-color-scheme: light){
    :root{--bg:#f1f5f9;--card:#ffffff;--card2:#f8fafc;--fg:#0f172a;--muted:#64748b;--border:#d5dde8;--accent:#f59e0b;--accent-fg:#1c1303;--ok:#047857;--okbg:rgba(16,185,129,.15);--bad:#be123c;--badbg:rgba(244,63,94,.12)}
  }
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6;-webkit-text-size-adjust:100%;padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
  .wrap{max-width:720px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px}
  h1{font-size:22px;margin:6px 0 4px}
  .sub{font-size:13px;color:var(--muted);margin:0}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(245,158,11,.15);color:var(--accent);border:1px solid rgba(245,158,11,.35)}
  .tabs{display:flex;gap:6px;background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:4px;margin-top:12px}
  .tab{flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:15px;font-weight:700}
  .tab.on{background:var(--accent);color:var(--accent-fg)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  label.lb{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
  select{width:100%;min-height:46px;font-size:16px;padding:0 10px;border-radius:12px;border:1px solid var(--border);background:var(--card2);color:var(--fg);-webkit-appearance:none;appearance:none}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}
  .chk{display:flex;align-items:center;gap:8px;font-size:14px;min-height:40px}
  .chk input{width:22px;height:22px;accent-color:var(--accent)}
  .seg{display:flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:3px}
  .seg span{font-size:13px;color:var(--muted);padding:0 6px}
  .seg button{min-height:38px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:600}
  .seg button.on{background:var(--accent);color:var(--accent-fg)}
  .btn{min-height:50px;padding:0 18px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-fg);font-size:16px;font-weight:800}
  .btn.ghost{background:var(--card2);color:var(--fg);border:1px solid var(--border);font-weight:600}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.4}
  .full{width:100%}
  .meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .badge{font-size:13px;font-weight:800;padding:4px 10px;border-radius:8px;background:rgba(245,158,11,.18);color:var(--accent)}
  .cat{font-size:12px;color:var(--muted);padding:4px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card2)}
  .score{font-size:15px;font-weight:700}
  .bar{height:8px;background:var(--card2);border:1px solid var(--border);border-radius:99px;overflow:hidden;margin-bottom:14px}
  .bar>div{height:100%;background:var(--accent);transition:width .25s}
  .q{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:14px;font-size:18px;font-weight:700;line-height:1.7;margin:12px 0}
  .opts{display:grid;grid-template-columns:1fr;gap:10px}
  .opt{width:100%;min-height:56px;text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--border);background:var(--card2);color:var(--fg);font-size:17px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  .opt:active:not(:disabled){border-color:var(--accent)}
  .opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
  .opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
  .opt.dim{opacity:.5}
  .exp{margin-top:14px;padding:14px;border-radius:14px;border:1px solid rgba(245,158,11,.45);background:rgba(245,158,11,.1)}
  .exp b{display:block;font-size:16px;margin-bottom:6px}
  .exp p{margin:0 0 10px;font-size:15px}
  .hidden{display:none!important}
  .status{font-size:12px;color:var(--accent);margin-left:auto}
  textarea{width:100%;min-height:300px;padding:12px;font-size:14px;line-height:1.6;border-radius:12px;border:1px solid var(--border);background:var(--card2);color:var(--fg);font-family:ui-monospace,Menlo,monospace}
  .toast{padding:10px 14px;border-radius:12px;background:var(--okbg);color:var(--ok);font-weight:700;font-size:14px;margin:10px 0}
  .nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px calc(12px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));background:var(--card);border-top:1px solid var(--border);z-index:10}
  .nav .btn{flex:1;padding:0 8px}
  .nav .btn.mid{flex:.8}
  .tip{font-size:12px;color:var(--muted);margin-top:10px}
  @media (min-width:640px){.opts{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <span class="tag">⚡ 熱門寶可夢・隨機抽題・不含御三家</span>
    <h1>寶可夢語音猜謎</h1>
    <p class="sub" id="subtitle"></p>
    <div class="tabs">
      <button id="tab-quiz" class="tab on" onclick="switchTab('quiz')">🎮 猜謎</button>
      <button id="tab-copy" class="tab" onclick="switchTab('copy')">📋 複製題庫</button>
    </div>
    <div class="grid2">
      <div>
        <label class="lb" for="gen-select">世代</label>
        <select id="gen-select" onchange="generateRandomQuiz()">
          <option value="0" selected>🌍 全部世代</option>
          <option value="1">第 1 世代（關都）</option>
          <option value="2">第 2 世代（城都）</option>
          <option value="3">第 3 世代（豐緣）</option>
          <option value="4">第 4 世代（神奧）</option>
          <option value="5">第 5 世代（合眾）</option>
          <option value="6">第 6 世代（卡洛斯）</option>
          <option value="7">第 7 世代（阿羅拉）</option>
          <option value="8">第 8 世代（伽勒爾）</option>
          <option value="9">第 9 世代（帕底亞）</option>
        </select>
      </div>
      <div>
        <label class="lb" for="count-select">題數</label>
        <select id="count-select" onchange="generateRandomQuiz()">
          <option value="10">🎲 10 題</option>
          <option value="20">🎲 20 題</option>
          <option value="50" selected>🎲 50 題</option>
          <option value="9999">🎲 全部</option>
        </select>
      </div>
    </div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="auto-speak-toggle" checked /> 🔊 自動朗讀</label>
      <div class="seg">
        <span>語速</span>
        <button id="rate-0.85" onclick="setRate(0.85)">慢</button>
        <button id="rate-1" class="on" onclick="setRate(1)">正常</button>
        <button id="rate-1.2" onclick="setRate(1.2)">快</button>
      </div>
    </div>
  </div>

  <div id="view-quiz">
    <div class="card">
      <div class="meta">
        <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
          <span class="badge" id="q-badge"></span>
          <span class="cat" id="q-category"></span>
        </div>
        <span class="score">得分 <span id="score-display" style="color:var(--accent)">0</span></span>
      </div>
      <div class="bar"><div id="progress-bar" style="width:0%"></div></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn" style="flex:1" onclick="speakCurrentQuestion()">🔊 朗讀題目</button>
        <button class="btn ghost" onclick="stopSpeaking()">⏹️</button>
      </div>
      <button class="btn ghost full" style="margin-top:8px" onclick="speakCurrentOptions()">🔊 重念選項</button>
      <div style="min-height:18px"><span class="status" id="speech-status"></span></div>
      <div class="q" id="question-text"></div>
      <div class="opts" id="options-container"></div>
      <div class="exp hidden" id="explanation-box">
        <b id="feedback-title"></b>
        <p id="explanation-text"></p>
        <button class="btn ghost" onclick="speakExplanation()" style="min-height:44px;font-size:14px">🔊 朗讀解析</button>
      </div>
      <p class="tip">📱 iPhone 提示：請先把靜音開關（側邊撥桿）關閉，並調高音量，才聽得到語音。</p>
    </div>
  </div>

  <div id="view-copy" class="hidden">
    <div class="card">
      <h2 style="margin:0 0 4px;font-size:18px">📋 題庫複製區</h2>
      <p class="sub">目前隨機抽出的這批題目，可貼到 LINE 考朋友。</p>
      <div class="row">
        <button class="btn" style="flex:1" onclick="copyAllQuestions(false)">複製純題目</button>
        <button class="btn ghost" style="flex:1" onclick="copyAllQuestions(true)">複製＋解答</button>
      </div>
      <div class="toast hidden" id="copy-toast">✅ 已複製！</div>
      <textarea id="copy-textarea" readonly></textarea>
    </div>
  </div>
</div>

<div class="nav" id="nav">
  <button class="btn ghost" id="prev-btn" onclick="prevQuestion()">⬅️ 上一題</button>
  <button class="btn ghost mid" onclick="generateRandomQuiz()">🎲 換一批</button>
  <button class="btn" id="next-btn" onclick="nextQuestion()">下一題 ➡️</button>
</div>

<script>
const REGION = { 1:"關都",2:"城都",3:"豐緣",4:"神奧",5:"合眾",6:"卡洛斯",7:"阿羅拉",8:"伽勒爾",9:"帕底亞" };

      ["雷丘", 1, "電", "全身橘色，細長的尾巴末端像閃電的形狀，是由皮卡丘接觸雷之石進化而來。"],
      ["胖丁", 1, "一般・妖精", "粉紅色圓滾滾的身體，拿起麥克風唱歌會讓聽眾全部睡著，生氣時還會在睡著的人臉上塗鴉。"],
      ["皮皮", 1, "妖精", "粉紅色、耳朵尖尖的可愛寶可夢，傳說會在滿月的夜晚聚集起來跳舞。"],
      ["六尾", 1, "火", "紅褐色的小狐狸，剛出生時只有一條白色尾巴，長大後會分岔成六條捲捲的尾巴。"],
      ["九尾", 1, "火", "全身金黃色的優雅狐狸，擁有九條尾巴，傳說能活上一千年。"],
      ["喵喵", 1, "一般", "額頭上有一枚閃亮的金幣，在動畫中是火箭隊成員，還會說人話。"],
      ["可達鴨", 1, "水", "總是抱著頭的黃色鴨子，頭痛越嚴重，無意識中使出的念力就越強大。"],
      ["卡蒂狗", 1, "火", "橘色身體帶黑色條紋的小狗，對訓練家非常忠誠，會勇敢吠叫保護主人。"],
      ["風速狗", 1, "火", "威風凜凜的火屬性神犬，據說一天一夜就能奔跑一萬公里。"],

      ["怪力", 1, "格鬥", "擁有四條肌肉發達的手臂，短短兩秒內就能揮出一千拳。"],
      ["呆呆獸", 1, "水・超能力", "粉紅色、動作慢吞吞，喜歡把尾巴伸進水裡釣魚，反應遲鈍到被咬了也不太覺得痛。"],

let activeQuestions = [], currentIndex = 0, score = 0, answeredMap = {}, speechRate = 1;
const optionLabels = ["A","B","C","D"];

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function buildQuestion(p){
  const [name,gen,type,desc]=p;
  const sameGen=shuffle(POKEMON.filter(o=>o[0]!==name&&o[1]===gen)).map(o=>o[0]);
  const others=shuffle(POKEMON.filter(o=>o[0]!==name&&o[1]!==gen)).map(o=>o[0]);
  const distractors=[...sameGen.slice(0,2),...others].filter((v,i,a)=>a.indexOf(v)===i).slice(0,3);
  const options=shuffle([name,...distractors]);
  const answer=options.indexOf(name);
  return {
    name,
    category: `第${gen}世代・${REGION[gen]}｜${type}屬性`,
    q: `${desc}請問這是哪一隻寶可夢？`,
    options, answer,
    explanation: `正確答案是 (${optionLabels[answer]}) ${name}！牠是第${gen}世代（${REGION[gen]}地區）的${type}屬性寶可夢。`
  };
}

function generateRandomQuiz(){
  stopSpeaking();
  const gen=parseInt(document.getElementById("gen-select").value,10);
  const count=parseInt(document.getElementById("count-select").value,10);
  const pool=POKEMON.filter(p=>gen===0||p[1]===gen);
  activeQuestions=shuffle(pool).slice(0,Math.min(count,pool.length)).map(buildQuestion);
  currentIndex=0;score=0;answeredMap={};
  document.getElementById("subtitle").textContent=`題庫 ${POKEMON.length} 隻熱門寶可夢，本次抽出 ${activeQuestions.length} 題`;
  renderQuestion(false);
  updateCopyTextarea();
  window.scrollTo(0,0);
}

function switchTab(tab){
  stopSpeaking();
  document.getElementById("view-quiz").classList.toggle("hidden",tab!=="quiz");
  document.getElementById("view-copy").classList.toggle("hidden",tab!=="copy");
  document.getElementById("nav").classList.toggle("hidden",tab!=="quiz");
  document.getElementById("tab-quiz").className="tab"+(tab==="quiz"?" on":"");
  document.getElementById("tab-copy").className="tab"+(tab==="copy"?" on":"");
  if(tab==="copy")updateCopyTextarea();
}

function setRate(r){
  speechRate=r;
  [0.85,1,1.2].forEach(x=>{document.getElementById(`rate-${x}`).className=(x===r?"on":"")});
}

function renderQuestion(autoSpeak){
  if(!activeQuestions.length)return;
  const item=activeQuestions[currentIndex],total=activeQuestions.length;
  document.getElementById("q-badge").textContent=`第 ${currentIndex+1} / ${total} 題`;
  document.getElementById("q-category").textContent=item.category;
  document.getElementById("score-display").textContent=`${score} / ${total}`;
  document.getElementById("progress-bar").style.width=`${((currentIndex+1)/total)*100}%`;
  document.getElementById("question-text").textContent=item.q;
  const box=document.getElementById("options-container");
  box.innerHTML="";
  const sel=answeredMap[currentIndex],answered=sel!==undefined;
  item.options.forEach((opt,idx)=>{
    const b=document.createElement("button");
    b.disabled=answered;
    let cls="opt",mark="";
    if(answered){
      if(idx===item.answer){cls+=" ok";mark="✅"}
      else if(idx===sel){cls+=" bad";mark="❌"}
      else cls+=" dim";
    }
    b.className=cls;
    b.innerHTML=`<span>(${optionLabels[idx]}) ${opt}</span><span>${mark}</span>`;
    b.onclick=()=>selectAnswer(idx);
    box.appendChild(b);
  });
  const eb=document.getElementById("explanation-box");
  eb.classList.toggle("hidden",!answered);
  if(answered){
    const ok=sel===item.answer;
    document.getElementById("feedback-title").textContent=ok?"🎉 答對了！":"💡 差一點點！";
    document.getElementById("explanation-text").textContent=item.explanation;
  }
  document.getElementById("prev-btn").disabled=currentIndex===0;
  document.getElementById("next-btn").textContent=currentIndex===total-1?"完成 🏆":"下一題 ➡️";
  if(autoSpeak&&document.getElementById("auto-speak-toggle").checked)speakCurrentQuestion();
}

function selectAnswer(idx){
  if(answeredMap[currentIndex]!==undefined)return;
  answeredMap[currentIndex]=idx;
  const item=activeQuestions[currentIndex],ok=idx===item.answer;
  if(ok)score++;
  renderQuestion(false);
  if(document.getElementById("auto-speak-toggle").checked)speakExplanation();
}
function prevQuestion(){if(currentIndex>0){stopSpeaking();currentIndex--;renderQuestion(true);window.scrollTo(0,0)}}
function nextQuestion(){
  if(currentIndex<activeQuestions.length-1){stopSpeaking();currentIndex++;renderQuestion(true);window.scrollTo(0,0)}
  else speakText(`恭喜完成挑戰！您在 ${activeQuestions.length} 題中答對了 ${score} 題！`);
}

/* ===== 語音播放系統（微軟曉臻真人 MP3 優先 ＋ 原生語音備援） ===== */
let currentAudio = null;
let speechTimer = null;
let playbackSession = 0;
let cachedVoice = null;

function pickVoice(){
  if(!("speechSynthesis" in window))return null;
  const vs=speechSynthesis.getVoices();
  if(!vs.length)return cachedVoice;
  cachedVoice=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/zh[-_]HK/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||cachedVoice;
  return cachedVoice;
}

function stopSpeaking(){
  playbackSession++;
  clearTimeout(speechTimer);
  speechTimer = null;
  if(currentAudio){
    currentAudio.onplay = currentAudio.onended = currentAudio.onerror = null;
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }
  if("speechSynthesis" in window && (speechSynthesis.speaking || speechSynthesis.pending)) speechSynthesis.cancel();
  const s = document.getElementById("speech-status");
  if(s) s.textContent = "";
}

function usesAppleTouchSpeech(){
  return /iPhone|iPad|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}

function playNativeSpeech(text){
  const s = document.getElementById("speech-status");
  if(!("speechSynthesis" in window)){
    if(s) s.textContent = "⚠️ 此瀏覽器不支援語音";
    return;
  }
  speechSynthesis.cancel();
  clearTimeout(speechTimer);
  const session = playbackSession;
  const startSpeech = ()=>{
    speechTimer = null;
    if(session !== playbackSession) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-TW";
    u.rate = speechRate;
    u.volume = 1;
    const v = pickVoice();
    if(v) u.voice = v;
    u.onstart = () => { if(s) s.textContent = "🔊 播放中（原生系統語音）..."; };
    u.onend = () => { if(session === playbackSession && s) s.textContent = ""; };
    u.onerror = () => {
      if(session === playbackSession && s) s.textContent = "語音未能播放，請再點一次朗讀按鈕。";
    };
    speechSynthesis.speak(u);
  };
  // Apple touch browsers need speech to start within the button's user gesture.
  if(usesAppleTouchSpeech()) startSpeech();
  else speechTimer = setTimeout(startSpeech, 60);
}

function playAudioOrFallback(audioPath, fallbackText, onComplete){
  stopSpeaking();
  const session = playbackSession;
  const s = document.getElementById('speech-status');
  if(s) s.textContent = '🔊 載入真人語音中...';
  const audio = new Audio(audioPath);
  audio.volume = 1;
  audio.muted = false;
  audio.playbackRate = speechRate;
  currentAudio = audio;
  let fallbackStarted = false;
  function fallback(){
    if(session !== playbackSession || fallbackStarted) return;
    fallbackStarted = true;
    audio.onplay = audio.onended = audio.onerror = null;
    audio.pause();
    if(currentAudio === audio) currentAudio = null;
    playNativeSpeech(fallbackText);
  }
  audio.onplay = () => {
    if(session === playbackSession && s) s.textContent = '✨ 播放中（微軟真人曉臻語音）...';
  };
  audio.onended = () => {
    if(session !== playbackSession) return;
    if(s) s.textContent = '';
    if(currentAudio === audio) currentAudio = null;
    if(onComplete) onComplete();
  };
  audio.onerror = fallback;
  const playPromise = audio.play();
  if(playPromise !== undefined) playPromise.catch(fallback);
}

function speakText(text){
  stopSpeaking();
  playNativeSpeech(text);
}

function speakCurrentQuestion(){
  const item = activeQuestions[currentIndex];
  if(!item) return;
  const audioPath = 'audio/q_' + encodeURIComponent(item.name) + '.mp3';
  const optionsText = item.options.map((name,i)=>'選項 ' + optionLabels[i] + '，' + name).join('。') + '。';
  const fallbackText = '第 ' + (currentIndex + 1) + ' 題。' + item.q + '。' + optionsText;
  // Keep question and choices in one utterance on iPhone/iPad. Starting speech
  // from an MP3 ended callback can lose Safari's user-activation permission.
  if(usesAppleTouchSpeech()){
    speakText(fallbackText);
    return;
  }
  playAudioOrFallback(audioPath, fallbackText, ()=>playNativeSpeech(optionsText));
}

function speakCurrentOptions(){
  const item = activeQuestions[currentIndex];
  if(!item) return;
  const text = item.options.map((name,i)=>'選項 ' + optionLabels[i] + '，' + name).join('。') + '。';
  speakText(text);
}

function speakExplanation(){
  const item = activeQuestions[currentIndex];
  if(!item) return;
  const audioPath = 'audio/ans_' + encodeURIComponent(item.name) + '.mp3';
  playAudioOrFallback(audioPath, item.explanation);
}

function formatQuestions(includeAnswers){
  return activeQuestions.map((item,i)=>{
    const options = item.options.map((o,j)=>'(' + optionLabels[j] + ') ' + o).join('\n');
    return (i+1) + '. ' + item.q + '\n' + options + (includeAnswers ? '\n' + item.explanation : '');
  }).join('\n\n');
}

function updateCopyTextarea(){
  document.getElementById('copy-textarea').value = formatQuestions(false);
}

async function copyAllQuestions(includeAnswers){
  const area = document.getElementById('copy-textarea');
  const toast = document.getElementById('copy-toast');
  area.value = formatQuestions(includeAnswers);
  let copied = false;
  try {
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(area.value);
      copied = true;
    }
  } catch(e) {}
  if(!copied){
    area.focus();
    area.select();
    area.setSelectionRange(0, area.value.length);
    try { copied = document.execCommand('copy'); } catch(e) {}
  }
  toast.textContent = copied ? '✅ 已複製！' : '請長按文字區，選取並複製題庫。';
  toast.classList.remove('hidden');
  setTimeout(()=>toast.classList.add('hidden'), 2500);
}

if("speechSynthesis" in window){
  speechSynthesis.onvoiceschanged = pickVoice;
  pickVoice();
}

generateRandomQuiz();
</script>
